name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # node:test + tsx, plus jsdom (dev-only) so the interaction suite can mount
      # the real App and drive it with events. Covers contrast ratios, routing,
      # rendered accessibility semantics, the honesty guards over claim language,
      # response headers, and post-interaction behaviour. No browser is involved:
      # jsdom has no layout engine, so nothing here verifies appearance.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
