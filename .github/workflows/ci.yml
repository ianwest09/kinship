name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Dependency-free suite: node:test + tsx, both already in the project.
      # Covers contrast ratios, routing, rendered accessibility semantics and
      # the honesty guards over claim language.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
