<!doctype html>
<html lang="en" data-textsize="normal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kinship — Find a familiar feeling</title>
    <meta
      name="description"
      content="Kinship helps families share music, films and cultural touchstones that may feel familiar to someone living with dementia. Built on Qloo Taste AI for the Qloo Agentic Hackathon."
    />
    <meta name="theme-color" content="#F4F0E8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1B1A" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/kinship-mark.png" />
    <link rel="apple-touch-icon" href="/kinship-mark.png" />
    <!-- Two families, not three. JetBrains Mono was a third render-blocking
         request used only for small technical labels, and the splash waits on
         document.fonts.ready, so every extra family delayed the first usable
         frame. `font-mono` now resolves to the system monospace stack, which is
         already the fallback in tailwind.config.js and looks the same at the
         sizes it is used. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-parchment-100 text-loam-ink dark:bg-vinyl-950 dark:text-parchment-50 antialiased selection:bg-plum-600 selection:text-white"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
